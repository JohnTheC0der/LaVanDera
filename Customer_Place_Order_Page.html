<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order - LaVanDera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="lavandera_theme.css">
    <style>
        /* page-only: heading block above each step */
        .lv-step-head { margin-bottom: 14px; }
        .lv-step-head h2 { font-size: 20px; color: var(--lv-plum); }
        .lv-step-head p { color: var(--lv-muted); font-size: 13.5px; margin-top: 3px; }
    </style>
</head>

<body>
    <div id="lv-nav"></div>

    <main class="lv-container">

        <!-- PAGE HEAD -->
        <section class="lv-page-head">
            <div class="lv-eyebrow">Three quick steps</div>
            <h1 class="lv-title">Place an Order</h1>
            <p class="lv-sub">Select a store &rarr; pick a payment option (Cash or GCash) &rarr; choose your bag,
                then review everything before we send it to the shop.</p>
        </section>

        <!-- STEPPER -->
        <div class="lv-steps" id="stepper"></div>

        <!-- STEP BODY -->
        <div id="stepBody"></div>

    </main>

    <script src="lavandera_demo.js"></script>
    <script>
        const STEP_LABELS = ['Store', 'Payment', 'Bag'];
        const PAYMENTS = [
            { key: 'cash',  icon: 'fa-money-bill-wave',      title: 'Cash',  sub: 'Pay the rider or the store on delivery' },
            { key: 'gcash', icon: 'fa-mobile-screen-button', title: 'GCash', sub: 'Pay online now - reference number issued' }
        ];
        let step = 1;
        let storeId = null;
        let payment = null;
        let bag = null;
        let notes = '';

        const me = LV.requireRole('customer', 'Log_In_Page.html');
        if (me) {
            LV.renderNav('customer', 'place');
            init();
        }

        /* ---------------------------------------------------------- init */
        function availableStores() {
            return LV.publicStores().filter(function (s) {
                return s.accepting !== false && s.prices && s.lat != null;
            });
        }

        function init() {
            const stores = availableStores();
            if (!stores.length) {
                document.getElementById('stepper').style.display = 'none';
                document.getElementById('stepBody').innerHTML =
                    '<div class="lv-card lv-empty"><i class="fa-solid fa-store-slash"></i>' +
                    '<h3>No stores available right now</h3>' +
                    '<p>Partner laundromats are joining every day - check back soon.</p>' +
                    '<a href="Customer_Home_Page.html" class="lv-btn lv-btn-primary" style="margin-top:16px;">Back to Home</a></div>';
                return;
            }
            /* deep link ?store=ID preselects a store and jumps to the payment step */
            const q = new URLSearchParams(location.search).get('store');
            if (q && stores.some(function (s) { return s.id === Number(q); })) {
                storeId = Number(q);
                step = 2;
            }
            render();
        }

        /* -------------------------------------------------------- render */
        function render() {
            document.getElementById('stepper').innerHTML = stepper();
            const host = document.getElementById('stepBody');
            if (step === 1) host.innerHTML = stepStore();
            else if (step === 2) host.innerHTML = stepPayment();
            else host.innerHTML = stepBag();

            const t = document.getElementById('orderNotes');
            if (t) {
                t.value = notes;
                t.addEventListener('input', function () { notes = t.value; });
            }
        }

        function stepper() {
            return STEP_LABELS.map(function (label, i) {
                const n = i + 1;
                const cls = n < step ? 'done' : n === step ? 'active' : '';
                const inner = n < step ? '<i class="fa-solid fa-check"></i>' : n;
                return (i ? '<div class="lv-step-line"></div>' : '') +
                    '<div class="lv-step ' + cls + '"><span class="lv-step-num">' + inner + '</span>' + label + '</div>';
            }).join('');
        }

        function stepHead(num, title, sub) {
            return '<div class="lv-step-head"><div class="lv-eyebrow">Step ' + num + '</div><h2>' + title +
                '</h2><p>' + sub + '</p></div>';
        }

        function progressLine() {
            const s = LV.store(storeId);
            if (!s) return '';
            return '<div class="lv-muted" style="font-size:13px; margin-bottom:14px;">' +
                '<i class="fa-solid fa-store" style="color:var(--lv-pink);"></i> Continuing with <strong style="color:var(--lv-plum);">' +
                LV.esc(s.name) + '</strong></div>';
        }

        function goStep(n) { step = n; render(); }

        /* -------------------------------------------------- step 1: store */
        function stepStore() {
            const cards = availableStores().map(storeOption).join('');
            return stepHead(1, 'Choose a store', 'Only shops that are accepting new orders are listed.') +
                '<div class="lv-grid lv-grid-3">' + cards + '</div>' +
                '<div class="lv-row" style="justify-content:flex-end; margin-top:22px;">' +
                    '<button type="button" class="lv-btn lv-btn-primary" onclick="goStep(2)"' +
                    (storeId ? '' : ' disabled') + '>Continue <i class="fa-solid fa-arrow-right"></i></button>' +
                '</div>';
        }

        function storeOption(s) {
            const c = LV.customer(me.id);
            const hasCoords = c && c.lat != null && s.lat != null;
            const km = hasCoords ? LV.distanceKm(c.lat, c.lng, s.lat, s.lng) : 0;
            const fee = LV.deliveryFee(km);
            return '<div class="lv-option' + (storeId === s.id ? ' selected' : '') + '" onclick="pickStore(' + s.id + ')">' +
                '<span class="lv-check"><i class="fa-solid fa-check"></i></span>' +
                '<div class="lv-option-title">' + LV.esc(s.name) + '</div>' +
                '<div class="lv-option-sub">' + LV.esc(s.address || 'Address to be confirmed') + '</div>' +
                '<div class="lv-option-sub" style="margin-top:9px;"><i class="fa-solid fa-location-dot" style="color:var(--lv-pink);"></i> ' +
                    (hasCoords ? km + ' km away' : 'Distance to confirm') + ' &middot; est. rider fee ' + LV.peso(fee) + ' each way</div>' +
                '<div class="lv-option-sub" style="margin-top:3px;">Small ' + LV.peso(s.prices.small) +
                    ' &middot; Medium ' + LV.peso(s.prices.medium) + ' &middot; Large ' + LV.peso(s.prices.large) + '</div>' +
            '</div>';
        }

        function pickStore(id) { storeId = id; bag = null; render(); }

        /* ------------------------------------------------ step 2: payment */
        function stepPayment() {
            const cards = PAYMENTS.map(function (p) {
                return '<div class="lv-option' + (payment === p.key ? ' selected' : '') + '" onclick="pickPayment(\'' + p.key + '\')">' +
                    '<span class="lv-check"><i class="fa-solid fa-check"></i></span>' +
                    '<div class="lv-option-title"><i class="fa-solid ' + p.icon + '" style="color:var(--lv-pink);"></i> ' + p.title + '</div>' +
                    '<div class="lv-option-sub" style="margin-top:4px;">' + p.sub + '</div>' +
                '</div>';
            }).join('');

            return stepHead(2, 'Payment method', 'How would you like to settle the bill?') +
                progressLine() +
                '<div class="lv-grid lv-grid-2">' + cards + '</div>' +
                '<div class="lv-row-between" style="margin-top:22px;">' +
                    '<button type="button" class="lv-btn lv-btn-outline" onclick="goStep(1)">' +
                        '<i class="fa-solid fa-arrow-left"></i> Back</button>' +
                    '<button type="button" class="lv-btn lv-btn-primary" onclick="goStep(3)"' +
                        (payment ? '' : ' disabled') + '>Continue <i class="fa-solid fa-arrow-right"></i></button>' +
                '</div>';
        }

        function pickPayment(key) { payment = key; render(); }

        /* --------------------------------------------------- step 3: bag */
        function computeFees() {
            const store = LV.store(storeId);
            const c = LV.customer(me.id);
            const free = (store.benefits || []).indexOf('Free delivery') > -1;
            const distance = LV.distanceKm(c.lat, c.lng, store.lat, store.lng);
            const storeFee = bag ? store.prices[bag] : 0;
            const leg = free ? 0 : LV.deliveryFee(distance);
            return { store: store, free: free, distance: distance, storeFee: storeFee, send: leg, ret: leg,
                     total: storeFee + leg + leg };
        }

        function stepBag() {
            const f = computeFees();
            const cards = LV.bags.map(function (b) {
                return '<div class="lv-option' + (bag === b.code ? ' selected' : '') + '" onclick="pickBag(\'' + b.code + '\')">' +
                    '<span class="lv-check"><i class="fa-solid fa-check"></i></span>' +
                    '<div class="lv-option-title">' + LV.esc(b.name) + '</div>' +
                    '<div class="lv-option-sub">Up to ' + b.kg + ' KG</div>' +
                    '<div class="lv-option-price" style="margin-top:8px;">' + LV.peso(f.store.prices[b.code]) + '</div>' +
                '</div>';
            }).join('');

            return stepHead(3, 'Choose your bag', 'Pick the bag size and add any special instructions.') +
                progressLine() +
                '<div class="lv-grid lv-grid-3">' + cards + '</div>' +
                '<div class="lv-field" style="margin-top:20px;">' +
                    '<label class="lv-label" for="orderNotes">Notes (optional)</label>' +
                    '<textarea class="lv-textarea" id="orderNotes" placeholder="Special instructions for the rider or store..."></textarea>' +
                '</div>' +
                preview(f) +
                '<div class="lv-row-between" style="margin-top:22px;">' +
                    '<button type="button" class="lv-btn lv-btn-outline" onclick="goStep(2)">' +
                        '<i class="fa-solid fa-arrow-left"></i> Back</button>' +
                    '<button type="button" class="lv-btn lv-btn-pink" onclick="reviewOrder()"' +
                        (bag ? '' : ' disabled') + '>Review Order <i class="fa-solid fa-arrow-right"></i></button>' +
                '</div>';
        }

        function preview(f) {
            const storeRow = bag
                ? LV.peso(f.storeFee)
                : '<span class="lv-muted" style="font-weight:600;">Select a bag</span>';
            const freeTag = '<span style="color:var(--lv-green); font-weight:800;">FREE</span>';
            const total = bag ? '<span class="lv-total">' + LV.peso(f.total) + '</span>'
                              : '<span class="lv-muted">&mdash;</span>';
            return '<div class="lv-card lv-card-pad" style="margin-top:20px;">' +
                '<div class="lv-eyebrow">Live preview</div>' +
                '<h3 style="font-size:17px; color:var(--lv-plum); margin-bottom:6px;">Order summary</h3>' +
                '<div class="lv-kv"><span>Store fee</span><span>' + storeRow + '</span></div>' +
                '<div class="lv-kv"><span>Send fee (you &rarr; store' + (f.distance ? ', ' + f.distance + ' km' : '') + ')</span><span>' +
                    (f.free ? freeTag : LV.peso(f.send)) + '</span></div>' +
                '<div class="lv-kv"><span>Return fee (store &rarr; you)</span><span>' +
                    (f.free ? freeTag : LV.peso(f.ret)) + '</span></div>' +
                '<div class="lv-kv" style="border-bottom:none;"><span style="color:var(--lv-plum); font-weight:800;">Total</span><span>' + total + '</span></div>' +
                '<p class="lv-muted" style="font-size:12.5px; margin-top:8px;">' +
                    '<i class="fa-solid fa-circle-info" style="color:var(--lv-pink);"></i> ' +
                    (f.free ? 'This store includes free pickup and delivery.' :
                     'Rider fees are distance-based: ' + LV.peso(LV.settings.baseDeliveryFee) + ' for the first ' +
                     LV.settings.baseDistanceKm + ' km + ' + LV.peso(LV.settings.perKmFee) + ' per extra km.') +
                '</p></div>';
        }

        function pickBag(code) {
            const t = document.getElementById('orderNotes');
            if (t) notes = t.value;
            bag = code;
            render();
        }

        /* --------------------------------------------------- to confirm -- */
        function reviewOrder() {
            const t = document.getElementById('orderNotes');
            if (t) notes = t.value;
            if (!storeId || !payment || !bag) {
                LV.toast('Please finish every step first.', 'fa-circle-exclamation');
                return;
            }
            sessionStorage.setItem('lv_order_draft', JSON.stringify({
                storeId: storeId,
                payment: payment,
                bag: bag,
                notes: notes
            }));
            location.href = 'Customer_Confirm_Order.html';
        }
    </script>
</body>

</html>
