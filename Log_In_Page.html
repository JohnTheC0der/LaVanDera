<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAVANDERA - Modern Laundry Service Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Fredoka:wght@500;600;700&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --brand-pink: #FF66CC;
            --brand-pink-glow: rgba(255, 102, 204, 0.45);
            --brand-purple: #E056FD;
            --brand-cyan: #00F2FE;
            --dark-plum: #140613;
            --card-bg: rgba(30, 10, 27, 0.65);
            --card-border: rgba(255, 102, 204, 0.28);
            --input-bg: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 102, 204, 0.22);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Fredoka', cursive, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            background: url(lavandera_Background.png);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 1.5rem;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--card-border);
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.7),
                0 0 50px rgba(255, 102, 204, 0.18),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
            border-radius: 32px;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            padding: 2.5rem 2.25rem;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }

        .glass-card:hover {
            box-shadow:
                0 35px 70px rgba(0, 0, 0, 0.8),
                0 0 60px rgba(255, 102, 204, 0.28),
                inset 0 1px 2px rgba(255, 255, 255, 0.35);
        }

        /* Brand Header Logo Typography */
        .brand-header {
            font-family: var(--font-display);
            letter-spacing: 0.08em;
            color: #FFFFFF;
            text-shadow: 0 0 16px var(--brand-pink-glow);
        }

        .input-group {
            position: relative;
            margin-bottom: 1.15rem;
        }

        .input-field {
            width: 100%;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 18px;
            padding: 0.85rem 1.25rem 0.85rem 2.85rem;
            color: #FFFFFF;
            font-size: 0.925rem;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.38);
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--brand-pink);
            box-shadow: 0 0 20px var(--brand-pink-glow);
        }

        .input-icon {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.45);
            transition: color 0.25s ease;
            pointer-events: none;
        }

        .input-field:focus~.input-icon {
            color: var(--brand-pink);
        }

        .password-toggle {
            position: absolute;
            right: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: var(--brand-pink);
        }

        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1.5px solid var(--input-border);
            border-radius: 6px;
            background: var(--input-bg);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .custom-checkbox:checked {
            background-color: var(--brand-pink);
            border-color: var(--brand-pink);
            box-shadow: 0 0 10px var(--brand-pink-glow);
        }

        .custom-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: #140613;
            font-weight: 900;
            font-size: 11px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #FF66CC 0%, #E056FD 100%);
            color: #120412;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 0.02em;
            padding: 0.85rem;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 102, 204, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 102, 204, 0.6);
            filter: brightness(1.08);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Tab Switcher Pills */
        .tab-switcher {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 4px;
            display: flex;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 9px 0;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--brand-pink);
            color: #140613;
            box-shadow: 0 4px 18px var(--brand-pink-glow);
        }

        /* Form Switching Animation */
        .form-container {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .form-hidden {
            display: none;
            opacity: 0;
            transform: scale(0.96);
        }
    </style>
</head>

<body>
    <main class="glass-card">

        <!-- Brand Logo Header -->
        <div class="flex flex-col items-center justify-center mb-6">
            <img src="Lavandera_logo.png" alt="Lavandera Logo"
                class="mx-auto h-20 w-auto object-contain drop-shadow-[0_0_15px_rgba(255,102,204,0.6)] mb-2"
                onerror="this.onerror=null; this.src='https://placehold.co/200x80/1a0a19/ff66cc?text=LAVANDERA';">
            <h1 class="brand-header text-2xl font-extrabold tracking-wider">LAVANDERA</h1>
            <p class="text-[10px] font-bold text-pink-300 uppercase tracking-widest -mt-0.5 opacity-90">Premium Laundry
                Service</p>
        </div>

        <div class="tab-switcher">
            <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">LOG IN</button>
            <button class="tab-btn" id="signupTab" onclick="switchTab('signup')">SIGN UP</button>
        </div>

        <div id="loginForm" class="form-container">
            <div class="text-center mb-5">
                <h2 class="text-xl font-bold text-white tracking-wide" style="font-size: 30px; padding-bottom: 10px;">
                    Welcome Back</h2>
                <p class="text-xs font-semibold text-pink-200/70 uppercase tracking-wider mt-1">Enter your details to
                    manage your laundry</p>
            </div>

            <form onsubmit="handleAuthSubmit(event, 'login')">
                <!-- Username / Email Input -->
                <div class="input-group">
                    <label class="block text-xs font-bold text-pink-200 uppercase mb-1.5 ml-1">Username / Email</label>
                    <div class="relative">
                        <input type="text" id="loginUsername" required placeholder="Enter your username or email"
                            class="input-field">
                        <i class="fa-solid fa-user input-icon"></i>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <label class="block text-xs font-bold text-pink-200 uppercase mb-1.5 ml-1">Password</label>
                    <div class="relative">
                        <input type="password" id="loginPassword" required placeholder="••••••••••••"
                            class="input-field">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <i class="fa-solid fa-eye password-toggle"
                            onclick="togglePasswordVisibility('loginPassword', this)"></i>
                    </div>
                </div>

                <!-- Options Row -->
                <div class="flex items-center justify-between text-xs mb-6 px-1">
                    <label
                        class="flex items-center gap-2 cursor-pointer text-pink-100/80 hover:text-white font-medium select-none">
                        <input type="checkbox" class="custom-checkbox">
                        <span>Remember me</span>
                    </label>
                    <a href="javascript:void(0)"
                        onclick="showNotification('Password reset link sent to your registered email!')"
                        class="text-pink-300 hover:text-pink-100 font-bold hover:underline transition">Forgot
                        Password?</a>
                </div>

                <!-- Main CTA Button -->
                <button type="submit" class="btn-submit mb-4">
                    <span>Log In</span>
                </button>
            </form>

            <div class="text-center">
                <p class="text-xs text-pink-200/60 font-medium">
                    Don't have an account yet?
                    <a href="javascript:void(0)" onclick="switchTab('signup')"
                        class="text-pink-300 font-extrabold hover:underline ml-0.5">Sign up for free!</a>
                </p>
            </div>
        </div>

        <div id="signupForm" class="form-container form-hidden">
            <div class="text-center mb-5">
                <h2 class="text-xl font-bold text-white tracking-wide">Create Account</h2>
                <p class="text-xs font-semibold text-pink-200/70 uppercase tracking-wider mt-1">Join LAVANDERA for quick
                    scheduling</p>
            </div>

            <form onsubmit="handleAuthSubmit(event, 'signup')">
                <!-- Full Name -->
                <div class="input-group">
                    <label class="block text-xs font-bold text-pink-200 uppercase mb-1.5 ml-1">Full Name</label>
                    <div class="relative">
                        <input type="text" id="signupName" required placeholder="e.g. Maria Santos" class="input-field">
                        <i class="fa-solid fa-id-card input-icon"></i>
                    </div>
                </div>

                <!-- Email Input -->
                <div class="input-group">
                    <label class="block text-xs font-bold text-pink-200 uppercase mb-1.5 ml-1">Email Address</label>
                    <div class="relative">
                        <input type="email" id="signupEmail" required placeholder="name@example.com"
                            class="input-field">
                        <i class="fa-solid fa-envelope input-icon"></i>
                    </div>
                </div>

                <!-- Create Password -->
                <div class="input-group">
                    <label class="block text-xs font-bold text-pink-200 uppercase mb-1.5 ml-1">Create Password</label>
                    <div class="relative">
                        <input type="password" id="signupPassword" required placeholder="••••••••••••"
                            class="input-field">
                        <i class="fa-solid fa-key input-icon"></i>
                        <i class="fa-solid fa-eye password-toggle"
                            onclick="togglePasswordVisibility('signupPassword', this)"></i>
                    </div>
                </div>

                <!-- Terms Checkbox -->
                <div class="flex items-center gap-2 text-xs mb-6 px-1 select-none">
                    <input type="checkbox" required class="custom-checkbox" id="termsCheck">
                    <label for="termsCheck" class="text-pink-100/80 cursor-pointer">I agree to the <a
                            href="javascript:void(0)" onclick="showNotification('LAVANDERA Terms of Service loaded.')"
                            class="text-pink-300 font-bold hover:underline">Terms & Conditions</a></label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit mb-4">
                    <span>Create Account</span>
                </button>
            </form>

            <div class="text-center">
                <p class="text-xs text-pink-200/60 font-medium">
                    Already have an account?
                    <a href="javascript:void(0)" onclick="switchTab('login')"
                        class="text-pink-300 font-extrabold hover:underline ml-0.5">Log in here!</a>
                </p>
            </div>
        </div>
    </main>

    <div id="toast"
        class="fixed bottom-6 right-6 bg-pink-500 text-slate-950 font-bold px-5 py-3 rounded-2xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 z-50 flex items-center gap-2.5 border border-pink-300">
        <i class="fa-solid fa-circle-check text-lg"></i>
        <span id="toastMsg" class="text-sm">Success!</span>
    </div>

    <script>
        // Toggle Tab Functions (Login vs Sign Up)
        function switchTab(type) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');

            if (type === 'login') {
                signupForm.classList.add('form-hidden');
                loginForm.classList.remove('form-hidden');
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
            } else {
                loginForm.classList.add('form-hidden');
                signupForm.classList.remove('form-hidden');
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
            }
        }

        // Toggle Password Visibility
        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Toast Notification Handler
        let toastTimeout;
        function showNotification(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;

            toast.classList.remove('translate-y-20', 'opacity-0');

            if (toastTimeout) clearTimeout(toastTimeout);

            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3200);
        }

        // Form Submission Simulation
        function handleAuthSubmit(event, type) {
            event.preventDefault();
            const userVal = type === 'login'
                ? (document.getElementById('loginUsername').value || 'User')
                : (document.getElementById('signupName').value || 'User');

            const actionText = type === 'login' ? `Welcome back, ${userVal}!` : `Account created for ${userVal}!`;
            showNotification(actionText);
        }
    </script>
</body>

</html>
