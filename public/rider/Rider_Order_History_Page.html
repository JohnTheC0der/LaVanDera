<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAVANDERA - Order History</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #fff7fb;
            color: #333333;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            background-color: #e58db5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            height: 80px;
            width: auto;
            display: block;
            filter: brightness(0.6) contrast(1.2);
            margin-top: -10px;
            margin-bottom: -10px;
        }

        .menu-container {
            position: relative;
        }

        .menu-btn {
            background-color: #5a003c;
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-btn:hover {
            background-color: #800055;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 56px;
            background-color: white;
            width: 280px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            z-index: 1001;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-header {
            background-color: #f8f3f7;
            padding: 20px 18px;
            border-bottom: 1px solid #e8d4e0;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e58db5, #5a003c);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .user-name {
            font-size: 16px;
            font-weight: bold;
            color: #45002e;
            margin-bottom: 4px;
        }

        .user-email {
            font-size: 12px;
            color: #999;
            word-break: break-word;
        }

        .dropdown-divider {
            height: 1px;
            background-color: #e8d4e0;
            margin: 12px 0;
        }

        .dropdown-menu a {
            display: block;
            color: #45002e;
            padding: 14px 18px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid #f3d3e3;
            transition: all 0.3s ease;
        }

        .dropdown-menu a:last-child {
            border-bottom: none;
        }

        .dropdown-menu a:hover {
            background-color: #fff5fa;
            color: #5a003c;
            padding-left: 24px;
        }

        .dropdown-menu a i {
            margin-right: 8px;
            color: #e58db5;
            width: 16px;
        }

        /* PAGE WRAPPER */
        .page-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 5%;
            padding-top: 30px;
            padding-bottom: 40px;
        }


        /* BACK BUTTON */
        .back-btn {
            margin-bottom: 20px;
        }

        .back-btn a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #5a003c;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .back-btn a:hover {
            color: #e58db5;
        }

        /* PAGE HEADER */
        .page-header {
            margin-bottom: 25px;
        }

        .page-title {
            font-size: 30px;
            color: #45002e;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title i {
            color: #e58db5;
        }

        .page-subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        /* DELIVERIES PANEL */
        .deliveries-panel {
            background-color: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(90, 0, 60, 0.08);
        }

        .delivery-item {
            background-color: #f8f3f7;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            border-left: 4px solid #e58db5;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .delivery-item:hover {
            background-color: #fff5fa;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(229, 141, 181, 0.2);
        }

        .delivery-item:last-child {
            margin-bottom: 0;
        }

        .delivery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .delivery-shop {
            font-weight: bold;
            color: #45002e;
            font-size: 16px;
        }

        .delivery-order {
            margin-left: 6px;
            color: #8a6b7d;
            font-size: 12px;
            font-weight: 600;
        }

        .empty-history {
            padding: 20px 0;
            color: #777;
            text-align: center;
        }

        .delivery-distance {
            background-color: #e58db5;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .delivery-address {
            font-size: 13px;
            color: #555;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .delivery-address i {
            color: #3bb2b8;
            flex-shrink: 0;
        }

        .delivery-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #777;
        }

        .delivery-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .delivery-meta i {
            color: #3bb2b8;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 600px) {
            .page-title {
                font-size: 24px;
            }

            .deliveries-panel {
                padding: 16px;
            }

            .delivery-meta {
                flex-direction: column;
                gap: 6px;
            }
        }
    </style>
    <link rel="stylesheet" href="../css/rider_header.css">
    <link rel="stylesheet" href="../css/lavandera_logout.css">
    <script src="../js/lavandera_demo.js"></script>
    <script>LV.requireRole('rider');</script>
</head>

<body>
    <!-- HEADER -->
    <header class="rider-site-header">
        <a href="lavandera_rider_dashboard.html" class="logo">
            <img src="../images/LAVANDERA.svg" alt="Lavandera Logo" class="logo-img">
        </a>

        <div class="menu-container">
            <button class="menu-btn" type="button" onclick="toggleMenu()" aria-label="Toggle navigation menu"
                aria-expanded="false" aria-controls="navDropdown">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="dropdown-menu" id="navDropdown" role="navigation" aria-label="Rider navigation">
                <div class="dropdown-header">
                    <div class="user-avatar">A</div>
                    <div class="user-name">Alex Rodriguez</div>
                    <div class="user-email">alex.rodriguez@email.com</div>
                </div>
                <a href="lavandera_rider_dashboard.html"><i class="fa-solid fa-house"></i>Dashboard</a>
                <a href="Rider_Orders_Page.html"><i class="fa-solid fa-boxes-stacked"></i>Current Orders</a>
                <a href="Rider_Profile_Page.html"><i class="fa-solid fa-user"></i>Profile</a>
                <a href="../auth/Log_In_Page.html" onclick="LV.requestLogout(document.querySelector('.menu-btn')); return false;"><i class="fa-solid fa-sign-out-alt"></i>Logout</a>
            </div>
        </div>
    </header>

    <div class="page-wrapper">
        <!-- BACK BUTTON -->
        <div class="back-btn">
            <a href="Rider_Orders_Page.html">
                <i class="fa-solid fa-arrow-left"></i> Back to Current Orders
            </a>
        </div>

        <!-- PAGE HEADER -->
        <div class="page-header">
            <h1 class="page-title">
                <i class="fa-solid fa-clock-rotate-left"></i>
                Order History
            </h1>
            <p class="page-subtitle">View past completed delivery requests</p>
        </div>

        <!-- DELIVERIES PANEL -->
        <div class="deliveries-panel" id="historyOrders" aria-live="polite">
            <p class="empty-history">Loading completed deliveries...</p>
        </div>
    </div>

    <script>
        function renderHistory() {
            const rider = LV.requireRole('rider', '../auth/Log_In_Page.html');
            const host = document.getElementById('historyOrders');
            if (!rider) {
                host.innerHTML = '<p class="empty-history">Sign in as a rider to view completed deliveries.</p>';
                return;
            }

            const riderId = Number(rider.id);
            const completedOrders = LV.orders().map(function (order) {
                const riderJobs = (order.history || []).filter(function (entry) {
                    return Number(entry.by) === riderId &&
                        (entry.status === 'enroute_to_store' || entry.status === 'enroute_to_customer');
                });
                const assigned = Number(order.riderId) === riderId || riderJobs.length > 0;
                const earnings = riderJobs.reduce(function (total, entry) {
                    return total + Number(entry.status === 'enroute_to_store' ? order.sendFee : order.returnFee);
                }, 0);
                return { order: order, assigned: assigned, earnings: earnings };
            }).filter(function (item) {
                return item.assigned && item.order.status === 'completed';
            }).sort(function (a, b) {
                return new Date(b.order.completedAt || b.order.createdAt) -
                    new Date(a.order.completedAt || a.order.createdAt);
            });

            if (!completedOrders.length) {
                host.innerHTML = '<p class="empty-history">No completed deliveries yet.</p>';
                return;
            }

            host.innerHTML = completedOrders.map(function (item) {
                const order = item.order;
                const store = LV.store(order.storeId);
                const customer = LV.customer(order.customerId);
                const distance = Number(order.distanceKm);
                return '<article class="delivery-item">' +
                    '<div class="delivery-header">' +
                    '<div class="delivery-shop">' + LV.esc(store ? store.name : 'Laundry store') +
                    ' <span class="delivery-order">#' + LV.esc(order.id) + '</span></div>' +
                    '<div class="delivery-distance">' +
                    (Number.isFinite(distance) ? distance.toFixed(1) + ' km' : 'Distance unavailable') +
                    '</div></div>' +
                    '<div class="delivery-address"><i class="fa-solid fa-location-dot" aria-hidden="true"></i>' +
                    '<span>' + LV.esc(customer && customer.address ? customer.address : 'Delivery address unavailable') +
                    '</span></div>' +
                    '<div class="delivery-meta">' +
                    '<span><i class="fa-solid fa-clock" aria-hidden="true"></i> Completed ' +
                    LV.esc(LV.when(order.completedAt || order.createdAt)) + '</span>' +
                    '<span><i class="fa-solid fa-money-bill" aria-hidden="true"></i> Earnings ' +
                    LV.peso(item.earnings) + '</span>' +
                    '</div></article>';
            }).join('');
        }

        renderHistory();

        function toggleMenu() {
            const menu = document.getElementById('navDropdown');
            const button = document.querySelector('.menu-btn');
            const isOpen = menu.classList.toggle('show');
            button.setAttribute('aria-expanded', String(isOpen));
        }

        document.addEventListener('click', function (event) {
            if (!event.target.closest('.menu-container')) {
                document.getElementById('navDropdown').classList.remove('show');
                document.querySelector('.menu-btn').setAttribute('aria-expanded', 'false');
            }
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                document.getElementById('navDropdown').classList.remove('show');
                document.querySelector('.menu-btn').setAttribute('aria-expanded', 'false');
            }
        });
    </script>
</body>

</html>
