<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riders - LaVanDera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="lavandera_theme.css">
    <style>
        /* page-level additions: detail modal overlay only */
        .lv-modal-overlay {
            position: fixed; inset: 0; z-index: 80; display: none; place-items: center;
            background: rgba(43, 13, 30, 0.45);
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .lv-modal-overlay.open { display: grid; }
        .lv-modal {
            background: #fff; border-radius: var(--lv-radius); box-shadow: var(--lv-shadow-lg);
            width: calc(100% - 40px); max-width: 520px; max-height: 85vh; overflow: auto;
        }
    </style>
</head>

<body>
    <div id="lv-nav"></div>

    <main class="lv-container">

        <!-- PAGE HEAD -->
        <section class="lv-page-head">
            <div class="lv-eyebrow">Fleet management</div>
            <h1 class="lv-title">Riders</h1>
            <p class="lv-sub">Gig riders who carry laundry bags to and from partner stores. Review new sign-ups
                and keep the fleet in good shape.</p>
        </section>

        <!-- STATS -->
        <section class="lv-grid lv-grid-3" id="statGrid"></section>

        <!-- TOOLBAR -->
        <section class="lv-card lv-card-pad lv-mt">
            <div class="lv-row-between lv-wrap">
                <div class="lv-search" style="flex:1; min-width:240px;">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="riderSearch" class="lv-input" placeholder="Search name, email or contact number...">
                </div>
                <div class="lv-wrap" id="filterPills"></div>
            </div>
        </section>

        <!-- RIDERS TABLE -->
        <section class="lv-card lv-mt">
            <div class="lv-table-wrap">
                <table class="lv-table">
                    <thead>
                        <tr>
                            <th>Rider</th>
                            <th>Contact</th>
                            <th>Signed up</th>
                            <th>Jobs involved</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="riderRows"></tbody>
                </table>
            </div>
            <div id="riderEmpty"></div>
        </section>

    </main>

    <!-- DETAIL MODAL -->
    <div class="lv-modal-overlay" id="riderModal">
        <div class="lv-modal" id="riderModalPanel" role="dialog" aria-modal="true" aria-label="Rider details"></div>
    </div>

    <script src="lavandera_demo.js"></script>
    <script>
        let activeFilter = 'all';
        let searchQuery = '';

        const FILTERS = [
            { key: 'all',               label: 'All' },
            { key: 'active',            label: 'Active' },
            { key: 'pending_approval',  label: 'Pending approval' },
            { key: 'rejected',          label: 'Rejected' }
        ];

        const me = LV.requireRole('admin', 'Log_In_Page.html');
        if (me) {
            LV.renderNav('admin', 'riders');

            document.getElementById('riderSearch').addEventListener('input', function () {
                searchQuery = this.value.trim().toLowerCase();
                renderTable();
            });
            document.getElementById('riderModal').addEventListener('click', function (e) {
                if (e.target === this) closeModal();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeModal();
            });

            render();
        }

        /* ------------------------------------------------ helpers ---- */
        function getRider(id) {
            return LV.riders().find(function (r) { return r.id === Number(id); });
        }

        /* orders where this rider appears anywhere in the history */
        function jobsOf(rider) {
            return LV.orders().filter(function (o) {
                return (o.history || []).some(function (h) { return h.by === rider.id; });
            });
        }

        /* ------------------------------------------------- render ---- */
        function render() {
            renderStats();
            renderPills();
            renderTable();
        }

        function renderStats() {
            const rs = LV.riders();
            const active = rs.filter(function (r) { return r.status === 'active'; }).length;
            const pending = rs.filter(function (r) { return r.status === 'pending_approval'; }).length;
            const rejected = rs.filter(function (r) { return r.status === 'rejected'; }).length;

            const tiles = [
                { icon: 'fa-motorcycle',       value: active,   label: 'Active Riders' },
                { icon: 'fa-hourglass-half',   value: pending,  label: 'Pending Approval', amber: pending > 0 },
                { icon: 'fa-user-slash',       value: rejected, label: 'Rejected' }
            ];
            document.getElementById('statGrid').innerHTML = tiles.map(function (t) {
                const chip = t.amber ? ' style="background:var(--lv-amber-bg); color:var(--lv-amber);"' : '';
                return '<div class="lv-card lv-stat">' +
                    '<div class="lv-stat-icon"' + chip + '><i class="fa-solid ' + t.icon + '"></i></div>' +
                    '<div class="lv-stat-value">' + t.value + '</div>' +
                    '<div class="lv-stat-label">' + t.label + '</div></div>';
            }).join('');
        }

        function renderPills() {
            document.getElementById('filterPills').innerHTML = FILTERS.map(function (f) {
                const cls = f.key === activeFilter ? 'lv-btn lv-btn-primary lv-btn-sm' : 'lv-btn lv-btn-outline lv-btn-sm';
                return '<button class="' + cls + '" onclick="setFilter(\'' + f.key + '\')">' + f.label + '</button>';
            }).join('');
        }

        function setFilter(key) {
            activeFilter = key;
            renderPills();
            renderTable();
        }

        function filteredRiders() {
            return LV.riders().filter(function (r) {
                const okStatus = activeFilter === 'all' || r.status === activeFilter;
                const hay = (r.name + ' ' + r.email + ' ' + (r.contact || '')).toLowerCase();
                return okStatus && (!searchQuery || hay.indexOf(searchQuery) > -1);
            });
        }

        function renderTable() {
            const list = filteredRiders();
            const tbody = document.getElementById('riderRows');
            const empty = document.getElementById('riderEmpty');

            if (!list.length) {
                tbody.innerHTML = '';
                empty.innerHTML = '<div class="lv-empty"><i class="fa-solid fa-motorcycle"></i>' +
                    '<h3>No riders found</h3><p>Try another search term or switch the filter.</p></div>';
                return;
            }
            empty.innerHTML = '';

            tbody.innerHTML = list.map(function (r) {
                return '<tr>' +
                    '<td><div class="lv-row">' +
                        '<div class="lv-avatar lv-avatar-sm">' + LV.esc(LV.initials(r.name)) + '</div>' +
                        '<div><div style="font-weight:800; color:var(--lv-plum);">' + LV.esc(r.name) + '</div>' +
                        '<div class="lv-muted" style="font-size:12.5px;">' + LV.esc(r.email) + '</div></div>' +
                    '</div></td>' +
                    '<td>' + LV.esc(r.contact || '—') + '</td>' +
                    '<td>' + LV.when(r.joined) + '</td>' +
                    '<td>' + jobsOf(r).length + '</td>' +
                    '<td>' + LV.userStatusBadge(r.status) + '</td>' +
                    '<td><div class="lv-wrap">' + riderActions(r) + '</div></td>' +
                '</tr>';
            }).join('');
        }

        function riderActions(r) {
            if (r.status === 'pending_approval') {
                return '<button class="lv-btn lv-btn-primary lv-btn-sm" onclick="approveRider(' + r.id + ')">' +
                        '<i class="fa-solid fa-check"></i>Approve</button>' +
                       '<button class="lv-btn lv-btn-danger lv-btn-sm" onclick="rejectRider(' + r.id + ')">' +
                        '<i class="fa-solid fa-xmark"></i>Reject</button>';
            }
            let html = '<button class="lv-btn lv-btn-outline lv-btn-sm" onclick="openRider(' + r.id + ')">' +
                       '<i class="fa-solid fa-eye"></i>View</button>';
            if (r.status === 'active') {
                html += '<button class="lv-btn lv-btn-danger lv-btn-sm" onclick="suspendRider(' + r.id + ')">' +
                        '<i class="fa-solid fa-ban"></i>Suspend</button>';
            } else if (r.status === 'suspended') {
                html += '<button class="lv-btn lv-btn-outline lv-btn-sm" onclick="approveRider(' + r.id + ')">' +
                        '<i class="fa-solid fa-rotate-right"></i>Reactivate</button>';
            } else if (r.status === 'rejected') {
                html += '<button class="lv-btn lv-btn-primary lv-btn-sm" onclick="approveRider(' + r.id + ')">' +
                        '<i class="fa-solid fa-check"></i>Approve</button>';
            }
            return html;
        }

        /* ---------------------------------------------- mutations ---- */
        function approveRider(id) {
            const r = getRider(id); if (!r) return;
            LV.setUserStatus(r.id, 'active');
            LV.toast(r.name + ' approved - they can now sign in.');
            render();
        }

        function rejectRider(id) {
            const r = getRider(id); if (!r) return;
            const reason = prompt('Optional reason for rejecting ' + r.name + ' (leave blank to use the default):');
            if (reason === null) return;
            LV.setUserStatus(r.id, 'rejected', reason.trim() || 'Rejected by admin');
            LV.toast(r.name + ' was rejected.', 'fa-circle-xmark');
            render();
        }

        function suspendRider(id) {
            const r = getRider(id); if (!r) return;
            if (!confirm('Suspend ' + r.name + '? They will no longer be able to sign in as a rider.')) return;
            LV.setUserStatus(r.id, 'suspended');
            LV.toast(r.name + ' has been suspended.', 'fa-ban');
            render();
        }

        /* -------------------------------------------------- modal ---- */
        function openRider(id) {
            const r = getRider(id); if (!r) return;
            const jobs = jobsOf(r);

            let activity;
            if (jobs.length) {
                activity = jobs.map(function (o) {
                    const mine = (o.history || []).filter(function (h) { return h.by === r.id; });
                    const last = mine[mine.length - 1];
                    const store = LV.store(o.storeId);
                    return '<div class="lv-row" style="align-items:flex-start; padding:11px 0; border-bottom:1px dashed var(--lv-line);">' +
                        '<div class="lv-avatar lv-avatar-sm" style="background:var(--lv-pink-tint); color:var(--lv-plum);">' +
                            '<i class="fa-solid fa-motorcycle" style="font-size:14px;"></i></div>' +
                        '<div style="font-size:14px;">' +
                            '<span style="font-weight:800; color:var(--lv-plum);">#' + o.id + '</span>' +
                            ' &middot; ' + LV.esc(store ? store.name : 'Store') +
                            '<div class="lv-muted" style="font-size:12.5px;">' + LV.esc(last ? last.note : '') +
                                ' &middot; ' + LV.when(last ? last.at : o.createdAt) + '</div>' +
                        '</div></div>';
                }).join('');
            } else {
                activity = '<p class="lv-muted" style="font-size:14px; padding:10px 0;">No recorded activity yet.</p>';
            }

            document.getElementById('riderModalPanel').innerHTML =
                '<div class="lv-card-pad">' +
                    '<div class="lv-row-between" style="margin-bottom:16px;">' +
                        '<span class="lv-eyebrow" style="margin-bottom:0;">Rider profile</span>' +
                        '<button class="lv-menu-btn" style="width:36px; height:36px; border-radius:12px; font-size:14px; background:var(--lv-pink-tint); color:var(--lv-plum); box-shadow:none;" onclick="closeModal()" aria-label="Close">' +
                            '<i class="fa-solid fa-xmark"></i></button>' +
                    '</div>' +
                    '<div class="lv-row" style="margin-bottom:16px;">' +
                        '<div class="lv-avatar lv-avatar-lg">' + LV.esc(LV.initials(r.name)) + '</div>' +
                        '<div>' +
                            '<h3 style="font-size:20px; color:var(--lv-plum);">' + LV.esc(r.name) + '</h3>' +
                            '<div class="lv-muted" style="font-size:13.5px;">' + LV.esc(r.email) + '</div>' +
                            '<div style="margin-top:6px;">' + LV.userStatusBadge(r.status) + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="lv-kv"><span>Contact number</span><span>' + LV.esc(r.contact || '—') + '</span></div>' +
                    '<div class="lv-kv"><span>Joined</span><span>' + LV.when(r.joined) + '</span></div>' +
                    '<div class="lv-kv"><span>Status</span><span>' + LV.userStatusBadge(r.status) + '</span></div>' +
                    (r.statusNote
                        ? '<div class="lv-kv"><span>' + (r.status === 'rejected' ? 'Rejection reason' : 'Status note') +
                          '</span><span>' + LV.esc(r.statusNote) + '</span></div>'
                        : '') +
                    '<div class="lv-kv"><span>Jobs involved</span><span>' + jobs.length + '</span></div>' +
                    '<hr class="lv-divider">' +
                    '<h4 style="font-size:15px; color:var(--lv-plum); margin-bottom:6px;">Recent activity</h4>' +
                    activity +
                '</div>';
            document.getElementById('riderModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('riderModal').classList.remove('open');
        }
    </script>
</body>

</html>
